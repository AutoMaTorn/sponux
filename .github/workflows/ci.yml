name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no actions/setup-python: sponux imports PyGObject, which
      # comes from apt and is only visible to the system interpreter. A Python
      # installed alongside it would not see `gi` at all.
      - name: Install PyGObject and GTK 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0

      - name: Show what we are testing against
        run: |
          python3 --version
          python3 -c 'import gi; gi.require_version("Gtk", "4.0"); from gi.repository import Gtk; print(f"GTK {Gtk.get_major_version()}.{Gtk.get_minor_version()}")'

      # None of the suites need a display — checked — so there is no xvfb here.
      # The timeout is raised because the live index test waits on real inotify
      # events and a shared runner is slower than a desktop.
      - name: Run the checks
        env:
          SPONUX_TEST_TIMEOUT: "30"
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || status=1
            echo "::endgroup::"
          done
          exit $status

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      # dpkg-deb comes from dpkg, which is Essential, so only lintian is
      # missing. The builders themselves are standard-library Python.
      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian

      - name: Build the artifacts
        run: |
          python3 tools/mkdeb.py --no-lintian
          python3 tools/mktarball.py
          python3 tools/mkwheel.py
          ls -l dist/

      # The reproducibility claim in the README is only worth making if
      # something keeps checking it. Build a second time from the same tree and
      # require the bytes to match.
      - name: Prove the build is reproducible
        run: |
          sha256sum dist/* > /tmp/first.sha256
          rm -rf dist build
          python3 tools/mkdeb.py --no-lintian
          python3 tools/mktarball.py
          python3 tools/mkwheel.py
          sha256sum -c /tmp/first.sha256

      # One tag is expected: initial-upload-closes-no-bugs asks the changelog to
      # close a Debian bug number, which only applies to the Debian archive.
      - name: Lint the package
        run: |
          lintian --tag-display-limit 0 dist/*.deb | tee /tmp/lintian.txt
          if grep -v 'initial-upload-closes-no-bugs' /tmp/lintian.txt | grep -q .; then
            echo "lintian reported something new; see above"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sponux-packages
          path: dist/*
          if-no-files-found: error
